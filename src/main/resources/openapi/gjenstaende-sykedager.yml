openapi: 3.0.3
info:
  title: Spøkelse – gjenstående sykedager
  version: 1.0.0
  description: |
    Gir antall gjenstående sykedager for en person, slik det står i siste vedtak i ny løsning for sykepenger (Speil).

    Alle utfall av oppslaget gir `200` med feltet `status`:
    - `VEDTAK_I_NY_LØSNING`: Personen har et siste vedtak i ny løsning, og Infotrygd har ingen utbetaling etter det.
      Bare da er `gjenståendeDager` og `vurdertTilOgMed` med.
    - `SISTE_UTBETALING_I_INFOTRYGD`: Infotrygd har en utbetaling som slutter etter siste vedtak i ny løsning,
      eller personen har ingen vedtak i ny løsning, men har utbetalinger i Infotrygd (også gamle).
      Hent gjenstående sykedager fra Infotrygd.
    - `INGEN_VEDTAK`: Vi fant ingen vedtak for personen i ny løsning og ingen utbetalinger i Infotrygd.
      Det betyr **ikke** at personen aldri har hatt sykepenger. Vedtak fra før 16. mars 2022 og annullerte vedtak er ikke med.

    Svaret bygger bare på fattede vedtak. Sykdom som er under behandling, er ikke med.

    **Tallet gjelder per siste vedtak, ikke per i dag.** `vurdertTilOgMed` er siste dag i perioden vedtaket gjelder for.
    Har personen hatt sykepenger etter denne datoen, er det ikke fanget opp i tallet.

    Tallet tar ikke hensyn til:
    - ny rett til sykepenger etter 26 uker uten sykepenger
    - at sykedager som er eldre enn tre år, faller bort
    - sykdom som ikke er behandlet ennå
    - at graderte dager teller som hele dager, så personen kan ha brukt opp færre dager enn det ser ut som

    Siste vedtak er vedtaket med senest `vurdertTilOgMed`. Det kan være et vedtak med eller uten utbetaling.
    Et annullert vedtak regnes ikke med, og da gjelder forrige vedtak.

    **Kjent begrensning:** Hvis et vedtak uten utbetaling er annullert, fanges ikke annulleringen opp,
    og svaret kan fortsatt bygge på det annullerte vedtaket.
servers:
  - url: https://spokelse.intern.dev.nav.no
    description: dev
  - url: https://spokelse.intern.nav.no
    description: prod
paths:
  /gjenstaende-sykedager:
    post:
      summary: Hent gjenstående sykedager fra siste vedtak
      security:
        - azureAd: []
      description: Krever et Azure AD-token med rollen `aap-les`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
            example:
              fødselsnummer: "12345678911"
      responses:
        '200':
          description: Oppslaget gikk bra. `status` sier hvilket utfall det ble.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GjenståendeSykedager'
              examples:
                vedtakINyLøsning:
                  summary: Siste vedtak er i ny løsning
                  value:
                    status: VEDTAK_I_NY_LØSNING
                    gjenståendeDager: 112
                    vurdertTilOgMed: "2026-09-30"
                sisteUtbetalingIInfotrygd:
                  summary: Infotrygd har utbetalt etter siste vedtak, eller personen har bare utbetalinger i Infotrygd
                  value:
                    status: SISTE_UTBETALING_I_INFOTRYGD
                ingenVedtak:
                  summary: Ingen vedtak i ny løsning og ingen utbetalinger i Infotrygd
                  value:
                    status: INGEN_VEDTAK
        '400':
          description: Ugyldig request. Body mangler, er ikke JSON, eller `fødselsnummer` er ikke en streng på 11 siffer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feil'
              example:
                feilkode: UGYLDIG_FORESPØRSEL
                melding: Forventer en body med fødselsnummer på 11 siffer
        '401':
          description: Mangler gyldig token.
        '403':
          description: Tokenet mangler rollen `aap-les`.
        '500':
          description: Uventet feil, for eksempel at oppslaget mot Infotrygd feilet. Prøv igjen senere.
components:
  securitySchemes:
    azureAd:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Request:
      type: object
      required: [fødselsnummer]
      properties:
        fødselsnummer:
          type: string
          pattern: '^\d{11}$'
    GjenståendeSykedager:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [VEDTAK_I_NY_LØSNING, SISTE_UTBETALING_I_INFOTRYGD, INGEN_VEDTAK]
          description: Utfallet av oppslaget. Se beskrivelsen øverst.
        gjenståendeDager:
          type: integer
          description: Antall gjenstående sykedager per `vurdertTilOgMed`. Bare med når `status` er `VEDTAK_I_NY_LØSNING`.
        vurdertTilOgMed:
          type: string
          format: date
          description: Siste dag i perioden siste vedtak gjelder for. Bare med når `status` er `VEDTAK_I_NY_LØSNING`.
    Feil:
      type: object
      required: [feilkode, melding]
      properties:
        feilkode:
          type: string
          enum: [UGYLDIG_FORESPØRSEL]
        melding:
          type: string
          description: Forklaring for mennesker. Ikke bruk den til å styre logikk.
