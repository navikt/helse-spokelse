name: Aiven config for de andre topicene våre

on:
  push:
    branches:
      - main
    paths:
      - '.nais/boo.yaml'
      - '.nais/boo.*.yaml'
      - '.github/workflows/topics.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # for nais login

jobs:
  deploy-dev:
    name: Deploy til dev
    uses: navikt/sykepenger-github-workflows/.github/workflows/deploy-v2.yml@5ff5fbfcd847f89bd33941fd4a6212de7b3eb749 # v1.0.13
    with:
      manifest: .nais/boo.yaml
      environment: dev-gcp
    permissions:
      contents: read
      id-token: write # for nais login

  deploy-prod:
    name: Deploy til prod
    uses: navikt/sykepenger-github-workflows/.github/workflows/deploy-v2.yml@5ff5fbfcd847f89bd33941fd4a6212de7b3eb749 # v1.0.13
    with:
      manifest: .nais/boo.yaml
      environment: prod-gcp
    permissions:
      contents: read
      id-token: write # for nais login
