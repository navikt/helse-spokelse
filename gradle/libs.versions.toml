[versions]
tbdLibs = "20261029.1843"
# Nyere versjon bruker wiremock-jetty12, som kreves av Jetty 12-BOM-en i sykepenger-pluginen
tbdLibsSignedJwtIssuerTest = "20261029.1843"
sykepengerGradlePlugins = "20261029.1945"
smiley4KtorOpenapiTools = "5.7.0"
smiley4SchemaKenerator = "2.7.2"

[libraries]
awaitility = "org.awaitility:awaitility:4.3.0"
flyway-database-postgresql = "org.flywaydb:flyway-database-postgresql:13.12.1"
hikaricp = "com.zaxxer:HikariCP:7.1.0"
jsonassert = "org.skyscreamer:jsonassert:1.5.3"
kotliquery = "com.github.seratch:kotliquery:1.9.1"
ktor-client-cio = { module = "io.ktor:ktor-client-cio" }
ktor-client-core = { module = "io.ktor:ktor-client-core" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt" }
mockk = "io.mockk:mockk:1.14.12"
postgresql = "org.postgresql:postgresql:42.7.14"
rapidsAndRivers = "com.github.navikt:rapids-and-rivers:2026110308421793691732"
smiley4-ktor-openapi = { module = "io.github.smiley4:ktor-openapi", version.ref = "smiley4KtorOpenapiTools" }
smiley4-ktor-swagger-ui = { module = "io.github.smiley4:ktor-swagger-ui", version.ref = "smiley4KtorOpenapiTools" }
smiley4-schema-kenerator-core = { module = "io.github.smiley4:schema-kenerator-core", version.ref = "smiley4SchemaKenerator" }
smiley4-schema-kenerator-reflection = { module = "io.github.smiley4:schema-kenerator-reflection", version.ref = "smiley4SchemaKenerator" }
smiley4-schema-kenerator-swagger = { module = "io.github.smiley4:schema-kenerator-swagger", version.ref = "smiley4SchemaKenerator" }
sykepengerLibs-logging = "no.nav.sykepenger.libs:logging:20261116.0849"
tbdLibs-accessTokenProviderApi = { module = "com.github.navikt.tbd-libs:access-token-provider-api", version.ref = "tbdLibs" }
tbdLibs-accessTokenProviderTexas = { module = "com.github.navikt.tbd-libs:access-token-provider-texas", version.ref = "tbdLibs" }
tbdLibs-naisfulApp = { module = "com.github.navikt.tbd-libs:naisful-app", version.ref = "tbdLibs" }
tbdLibs-naisfulTestApp = { module = "com.github.navikt.tbd-libs:naisful-test-app", version.ref = "tbdLibs" }
tbdLibs-postgresTestdatabaser = { module = "com.github.navikt.tbd-libs:postgres-testdatabaser", version.ref = "tbdLibs" }
tbdLibs-signedJwtIssuerTest = { module = "com.github.navikt.tbd-libs:signed-jwt-issuer-test", version.ref = "tbdLibsSignedJwtIssuerTest" }

[bundles]
smiley4-ktor-openapi-tools = [
    "smiley4-ktor-openapi",
    "smiley4-ktor-swagger-ui",
    "smiley4-schema-kenerator-core",
    "smiley4-schema-kenerator-reflection",
    "smiley4-schema-kenerator-swagger",
]

[plugins]
sykepenger-deployable = { id = "no.nav.sykepenger.deployable", version.ref = "sykepengerGradlePlugins" }
