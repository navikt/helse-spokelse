apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: spokelse
  namespace: tbd
  labels:
    team: tbd
spec:
  port: 8080
  liveness:
    path: isalive
    initialDelay: 5
  readiness:
    path: isready
    initialDelay: 5
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  prometheus:
    enabled: true
    path: /metrics
  azure:
    application:
      enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: spapi
          permissions:
            roles:
              - "spleiselaget-les"
    outbound:
      rules:
        - application: logging
          namespace: nais-system
  env:
    - name: KAFKA_RAPID_TOPIC
      value: tbd.rapid.v1
    - name: KAFKA_CONSUMER_GROUP_ID
      value: tbd-spokelse-v1
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
