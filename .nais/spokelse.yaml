apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: spokelse
  namespace: tbd
  labels:
    team: tbd
spec:
  port: 8080
  liveness:
    path: isalive
    initialDelay: 5
  readiness:
    path: isready
    initialDelay: 5
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
  prometheus:
    enabled: true
    path: /metrics
  azure:
    application:
      enabled: true
      # Saksbehandlerne i Modia må kunne få et OBO-token for Spøkelse. v2 krever scopet personoversikt-les og
      # kjerneregelsettet i Tilgangsmaskinen, og de andre endepunktene krever en rolle, som OBO-tokens aldri har.
      allowAllUsers: true
  accessPolicy:
    inbound:
      rules:
        - application: spapi
          permissions:
            roles:
              - "spleiselaget-les"
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: spleis-api
        - application: populasjonstilgangskontroll
          namespace: tilgangsmaskin
  env:
    - name: KAFKA_RAPID_TOPIC
      value: tbd.rapid.v1
    - name: KAFKA_CONSUMER_GROUP_ID
      value: tbd-spokelse-v1
    - name: SPLEIS_API_URL
      value: http://spleis-api
    - name: TILGANGSMASKINEN_BASE_URL
      value: http://populasjonstilgangskontroll.tilgangsmaskin
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
