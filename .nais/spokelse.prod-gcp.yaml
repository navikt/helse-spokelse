spec:
  preStopHook:
    http:
      path: /stop
  strategy:
      rollingUpdate:
        maxSurge: 2 # ruller ut to nye podder samtidig
        maxUnavailable: 1 # terminerer en pod samtidig som de nye rulles ut
  ingresses:
    - https://spokelse.intern.nav.no
  resources:
    limits:
      memory: 1024Mi
  replicas:
    min: 3
    max: 6
  kafka:
    pool: nav-prod
  accessPolicy:
    inbound:
      rules:
        - application: fpsak
          namespace: teamforeldrepenger
          cluster: prod-fss
          permissions:
            roles:
              - "foreldrepenger-les"
        - application: fprisk
          namespace: teamforeldrepenger
          cluster: prod-fss
          permissions:
            roles:
              - "foreldrepenger-les"
        - application: fpabakus
          namespace: teamforeldrepenger
          cluster: prod-fss
          permissions:
            roles:
              - "foreldrepenger-les"
        - application: k9-abakus
          namespace: k9saksbehandling
          cluster: prod-fss
          permissions:
            roles:
              - "k9-les"
        - application: behandlingsflyt
          namespace: aap
          cluster: prod-gcp
          permissions:
            roles:
              - "aap-les"
        - application: postmottak-backend
          namespace: aap
          cluster: prod-gcp
          permissions:
            roles:
              - "aap-les"
        - application: dp-oppslag-ytelser
          namespace: teamdagpenger
          cluster: prod-gcp
          permissions:
            roles:
              - "dagpenger-les"
        - application: modiapersonoversikt-api
          namespace: personoversikt
          cluster: prod-gcp
          permissions:
            roles:
              - "personoversikt-les"
    outbound:
      external:
        - host: sykepengeperioder-api.prod-fss-pub.nais.io
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        pointInTimeRecovery: true
        tier: db-custom-1-3840
        name: spokelse
        databases:
          - name: spokelse
            envVarPrefix: DATABASE
        flags:
          - name: cloudsql.enable_pgaudit
            value: "on"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  env:
    - name: KAFKA_RESET_POLICY
      value: none
    - name: INFOTRYGD_SCOPE
      value: api://prod-fss.tbd.sparkel-sykepengeperioder-api/.default
    - name: INFOTRYGD_URL
      value: https://sykepengeperioder-api.prod-fss-pub.nais.io
