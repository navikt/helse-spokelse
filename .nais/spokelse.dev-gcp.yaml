spec:
  ingresses:
    - https://spokelse.intern.dev.nav.no
  resources:
    limits:
      memory: 512Mi
  replicas:
    min: 1
    max: 2
  kafka:
    pool: nav-dev
  azure:
    application:
      tenant: trygdeetaten.no
  accessPolicy:
    inbound:
      rules:
        - application: fpsak
          namespace: teamforeldrepenger
          cluster: dev-fss
          permissions:
            roles:
              - "foreldrepenger-les"
        - application: fprisk
          namespace: teamforeldrepenger
          cluster: dev-fss
          permissions:
            roles:
              - "foreldrepenger-les"
        - application: fpabakus
          namespace: teamforeldrepenger
          cluster: dev-fss
          permissions:
            roles:
              - "foreldrepenger-les"
        - application: k9-abakus
          namespace: k9saksbehandling
          cluster: dev-fss
          permissions:
            roles:
              - "k9-les"
        - application: behandlingsflyt
          namespace: aap
          cluster: dev-gcp
          permissions:
            roles:
              - "aap-les"
        - application: postmottak-backend
          namespace: aap
          cluster: dev-gcp
          permissions:
            roles:
              - "aap-les"
        - application: dp-oppslag-ytelser
          namespace: teamdagpenger
          cluster: dev-gcp
          permissions:
            roles:
              - "dagpenger-les"
        - application: modiapersonoversikt-api
          namespace: personoversikt
          cluster: dev-gcp
          permissions:
            roles:
              - "personoversikt-les"
    outbound:
      external:
        - host: sykepengeperioder-api.dev-fss-pub.nais.io
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        pointInTimeRecovery: true
        tier: db-f1-micro
        name: spokelse
        databases:
          - name: spokelse
            envVarPrefix: DATABASE
  env:
    - name: KAFKA_RESET_POLICY
      value: earliest
    - name: INFOTRYGD_SCOPE
      value: api://dev-fss.tbd.sparkel-sykepengeperioder-api/.default
    - name: INFOTRYGD_URL
      value: https://sykepengeperioder-api.dev-fss-pub.nais.io
